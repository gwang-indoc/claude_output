<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>claude_output – real-time session viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #0d1117;
      color: #c9d1d9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 1rem 1.5rem;
      border-bottom: 1px solid #21262d;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    header h1 {
      font-size: 1.125rem;
      font-weight: 600;
      color: #e6edf3;
    }

    header .badge {
      font-size: 0.7rem;
      padding: 0.15rem 0.5rem;
      border-radius: 999px;
      background: #1f6feb;
      color: #fff;
      font-weight: 500;
    }

    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
    }

    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; }
    }

    .panel {
      display: flex;
      flex-direction: column;
      border-right: 1px solid #21262d;
      padding: 1.25rem;
      gap: 0.75rem;
    }

    .panel:last-child { border-right: none; }

    label {
      font-size: 0.8rem;
      color: #8b949e;
      font-weight: 500;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    textarea, input, select {
      width: 100%;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      color: #c9d1d9;
      font-size: 0.9rem;
      padding: 0.6rem 0.75rem;
      resize: vertical;
      font-family: inherit;
    }

    textarea:focus, input:focus, select:focus {
      outline: none;
      border-color: #1f6feb;
    }

    #prompt { min-height: 8rem; }
    #system-prompt { min-height: 3.5rem; }

    .row { display: flex; gap: 0.75rem; align-items: flex-end; }
    .row > div { flex: 1; display: flex; flex-direction: column; gap: 0.4rem; }

    button#send {
      padding: 0.6rem 1.25rem;
      background: #1f6feb;
      border: none;
      border-radius: 6px;
      color: #fff;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s;
    }

    button#send:hover { background: #388bfd; }
    button#send:disabled { background: #21262d; color: #484f58; cursor: not-allowed; }

    #output-panel {
      position: relative;
    }

    #output {
      flex: 1;
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 0.75rem 1rem;
      overflow-y: auto;
      max-height: calc(100vh - 12rem);
      white-space: pre-wrap;
      word-break: break-word;
      font-family: ui-monospace, 'Cascadia Code', Menlo, monospace;
      font-size: 0.875rem;
      line-height: 1.6;
      color: #e6edf3;
    }

    #status {
      font-size: 0.78rem;
      color: #8b949e;
      min-height: 1.2em;
    }

    #status.streaming { color: #3fb950; }
    #status.error     { color: #f85149; }
    #status.done      { color: #8b949e; }

    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: #e6edf3;
      animation: blink 0.9s step-end infinite;
      vertical-align: text-bottom;
      margin-left: 1px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    #token-info {
      font-size: 0.78rem;
      color: #484f58;
    }
  </style>
</head>
<body>

<header>
  <h1>claude_output</h1>
  <span class="badge">real-time</span>
</header>

<main>
  <!-- ── Left panel: input ── -->
  <div class="panel">
    <div style="display:flex;flex-direction:column;gap:0.4rem">
      <label for="prompt">Prompt</label>
      <textarea id="prompt" placeholder="Enter your prompt here…"></textarea>
    </div>

    <div style="display:flex;flex-direction:column;gap:0.4rem">
      <label for="system-prompt">System prompt</label>
      <textarea id="system-prompt">You are a helpful assistant.</textarea>
    </div>

    <div class="row">
      <div>
        <label for="model">Model</label>
        <select id="model">
          <option value="claude-opus-4-5">claude-opus-4-5</option>
          <option value="claude-sonnet-4-5">claude-sonnet-4-5</option>
          <option value="claude-haiku-4-5">claude-haiku-4-5</option>
          <option value="claude-opus-4-0">claude-opus-4-0</option>
        </select>
      </div>
      <div>
        <label for="max-tokens">Max tokens</label>
        <input id="max-tokens" type="number" value="4096" min="1" max="16384" />
      </div>
    </div>

    <button id="send">Send ▶</button>
  </div>

  <!-- ── Right panel: output ── -->
  <div class="panel" id="output-panel">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <label>Output</label>
      <span id="token-info"></span>
    </div>
    <div id="output"><span id="cursor" class="cursor" style="display:none"></span></div>
    <div id="status"></div>
  </div>
</main>

<script>
  const sendBtn    = document.getElementById('send');
  const promptEl   = document.getElementById('prompt');
  const systemEl   = document.getElementById('system-prompt');
  const modelEl    = document.getElementById('model');
  const maxTokEl   = document.getElementById('max-tokens');
  const outputEl   = document.getElementById('output');
  const statusEl   = document.getElementById('status');
  const tokenEl    = document.getElementById('token-info');
  const cursorEl   = document.getElementById('cursor');

  let currentReader = null;

  sendBtn.addEventListener('click', startStream);
  promptEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) startStream();
  });

  async function startStream() {
    const prompt = promptEl.value.trim();
    if (!prompt) return;

    // Cancel any ongoing stream
    if (currentReader) {
      currentReader.cancel();
      currentReader = null;
    }

    outputEl.textContent = '';
    outputEl.appendChild(cursorEl);
    cursorEl.style.display = 'inline-block';
    tokenEl.textContent = '';
    setStatus('streaming', 'Streaming…');
    sendBtn.disabled = true;

    try {
      const res = await fetch('/stream', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          prompt,
          system: systemEl.value,
          model: modelEl.value,
          max_tokens: parseInt(maxTokEl.value, 10) || 4096,
        }),
      });

      if (!res.ok) {
        throw new Error(`HTTP ${res.status} ${res.statusText}`);
      }

      const reader = res.body.getReader();
      currentReader = reader;
      const decoder = new TextDecoder();
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        // Process complete SSE messages
        const parts = buffer.split('\n\n');
        buffer = parts.pop(); // keep incomplete trailing chunk

        for (const part of parts) {
          const eventMatch = part.match(/^event:\s*(.+)$/m);
          const dataMatch  = part.match(/^data:\s*(.+)$/m);
          if (!eventMatch || !dataMatch) continue;

          const event = eventMatch[1].trim();
          let data;
          try { data = JSON.parse(dataMatch[1]); } catch { continue; }

          if (event === 'delta') {
            // Insert text before the cursor
            outputEl.insertBefore(document.createTextNode(data.text), cursorEl);
            outputEl.scrollTop = outputEl.scrollHeight;
          } else if (event === 'done') {
            cursorEl.style.display = 'none';
            setStatus('done', `Done — stop reason: ${data.stop_reason}`);
            tokenEl.textContent = `↑ ${data.input_tokens} in  ↓ ${data.output_tokens} out`;
          } else if (event === 'error') {
            cursorEl.style.display = 'none';
            setStatus('error', `Error: ${data.message}`);
          }
        }
      }
    } catch (err) {
      if (err.name !== 'AbortError') {
        cursorEl.style.display = 'none';
        setStatus('error', `Connection error: ${err.message}`);
      }
    } finally {
      currentReader = null;
      sendBtn.disabled = false;
    }
  }

  function setStatus(cls, text) {
    statusEl.className = cls;
    statusEl.textContent = text;
  }
</script>
</body>
</html>
